:root{ /* Prometeu (P) — padrão */
  --bg:#050b13;--bg2:#081420;--card:#0a1a28;--card2:#0e2436;
  --txt:#e3f6ff;--txt2:#8fb6cc;--txt3:#4f7183;
  --acc:#22d3ee;--acc2:#0ea5b7;--gl:rgba(34,211,238,.35);
  --brd:rgba(34,211,238,.18);--brd2:rgba(255,255,255,.06);
  --glow1:rgba(34,211,238,.10);--glow2:rgba(14,165,183,.08);
  --nav:rgba(5,11,19,.72);--btxt:#04121a;--htmlbg:#050b13;
  --font-h:'Orbitron',sans-serif;--font-b:'Rajdhani',system-ui,sans-serif;
}
html.t-D{ --bg:#000;--bg2:#070707;--card:#0d0d0d;--card2:#141414;
  --txt:#fff;--txt2:#b8b8b8;--txt3:#6f6f6f;--acc:#f2f2f2;--acc2:#cfcfcf;
  --gl:rgba(255,255,255,.22);--brd:rgba(255,255,255,.16);--brd2:rgba(255,255,255,.06);
  --glow1:rgba(255,255,255,.05);--glow2:rgba(255,255,255,.03);
  --nav:rgba(0,0,0,.8);--btxt:#000;--htmlbg:#000;
  --font-h:'Segoe UI',system-ui,Arial,sans-serif;--font-b:'Segoe UI',system-ui,Arial,sans-serif; }
html.t-PR{ --bg:#120407;--bg2:#1a060a;--card:#1f0a10;--card2:#2a0e15;
  --txt:#ffe6ea;--txt2:#e0a3ad;--txt3:#8a5560;--acc:#ff3b5c;--acc2:#c62740;
  --gl:rgba(255,59,92,.33);--brd:rgba(255,59,92,.20);--brd2:rgba(255,255,255,.06);
  --glow1:rgba(255,59,92,.10);--glow2:rgba(198,39,64,.07);
  --nav:rgba(18,4,7,.75);--btxt:#fff;--htmlbg:#120407; }
html.t-PB{ --bg:#04060f;--bg2:#070c1a;--card:#0a1226;--card2:#0e1832;
  --txt:#e6edff;--txt2:#9db0d8;--txt3:#556685;--acc:#3b82f6;--acc2:#2563eb;
  --gl:rgba(59,130,246,.33);--brd:rgba(59,130,246,.20);--brd2:rgba(255,255,255,.06);
  --glow1:rgba(59,130,246,.10);--glow2:rgba(37,99,235,.07);
  --nav:rgba(4,6,15,.75);--btxt:#fff;--htmlbg:#04060f; }
html.t-L{ --bg:#F0EDE8;--bg2:#e7e2da;--card:#ffffff;--card2:#faf7f2;
  --txt:#2a2320;--txt2:#6b5f57;--txt3:#9a8d83;--acc:#c0563c;--acc2:#a5432b;
  --gl:rgba(192,86,60,.22);--brd:rgba(192,86,60,.22);--brd2:rgba(0,0,0,.08);
  --glow1:rgba(192,86,60,.08);--glow2:rgba(165,67,43,.05);
  --nav:rgba(255,255,255,.82);--btxt:#fff;--htmlbg:#F0EDE8;
  --font-h:'Segoe UI',system-ui,Arial,sans-serif;--font-b:'Segoe UI',system-ui,Arial,sans-serif; }

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--htmlbg);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--font-b);background:var(--bg);color:var(--txt);line-height:1.6;font-size:17px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 560px at 82% -10%,var(--glow1),transparent 60%),
             radial-gradient(820px 460px at -8% 18%,var(--glow2),transparent 55%);}
/* Arte em mármore do Prometeu como marca d'água do fundo */
:root{--arte:url("media/artes/arte-02-fundo.webp");--arteop:.22}
html.t-L{--arte:url("media/artes/arte-01-fundo.webp");--arteop:.28}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:var(--arte) center 30%/min(92vmin,940px) no-repeat;opacity:var(--arteop)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
h1,h2,h3,.brand{font-family:var(--font-h)}
a{color:var(--acc);text-decoration:none}
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:var(--nav);border-bottom:1px solid var(--brd2)}
.nav-in{display:flex;align-items:center;gap:10px 14px;min-height:60px;flex-wrap:wrap;padding:8px 0}
.brand{font-weight:900;font-size:15px;letter-spacing:.5px;color:var(--txt);display:flex;align-items:center;gap:8px}
.brand .dot{width:26px;height:26px;border-radius:50%;box-shadow:0 0 10px var(--gl);display:block}
.nav-links{margin-left:auto;display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.nav-links a{color:var(--txt2);font-size:14px;font-weight:600;transition:color .2s}
.nav-links a:hover,.nav-links a.here{color:var(--acc)}
@media(max-width:720px){ .nav-links{gap:6px 12px;width:100%} .nav-links a{font-size:13px} .brand{font-size:13px} }
.themes{display:flex;gap:6px;align-items:center}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--brd2);cursor:pointer;padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--acc)}
.lang{display:flex;gap:2px;border:1px solid var(--brd);border-radius:20px;overflow:hidden}
.lang button{background:none;border:none;color:var(--txt2);padding:5px 10px;font-family:var(--font-h);font-size:11px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--acc);color:var(--btxt)}
header.top{padding:46px 0 20px}
header.top h1{font-size:clamp(26px,5vw,40px);font-weight:800;margin-bottom:12px}
header.top p.lead{color:var(--txt2);font-size:18px;max-width:640px}
.man{padding:14px 0 70px}
.sec{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--brd);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sec>summary{padding:16px 18px;cursor:pointer;font-family:var(--font-h);font-weight:700;font-size:15px;color:var(--txt);list-style:none;display:flex;align-items:center;gap:12px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .n{min-width:30px;height:30px;border-radius:8px;background:rgba(127,127,127,.12);border:1px solid var(--brd);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px}
.sec>summary::after{content:"+";margin-left:auto;color:var(--acc);font-size:20px}
.sec[open]>summary::after{content:"−"}
.sec .body{padding:2px 20px 18px 62px}
.sec .body p{margin:10px 0;color:var(--txt2)}
.sec .body b{color:var(--txt)}
.sec .body ul,.sec .body ol{margin:10px 0 10px 20px;color:var(--txt2)}
.sec .body li{margin:6px 0}
.sec .body code{background:rgba(127,127,127,.14);padding:1px 6px;border-radius:5px;font-size:14px;color:var(--acc)}
.mshot{margin:16px 0 6px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.mshot img{width:232px;max-width:100%;border-radius:12px;border:1px solid var(--brd);box-shadow:0 8px 22px rgba(0,0,0,.28)}
.mshot figcaption{flex:1;min-width:190px;display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--txt2);padding-top:4px}
.mshot .fl{display:flex;gap:9px;align-items:flex-start}
.mshot .fl b{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#ff3b3b;color:#fff;font:700 13px/22px system-ui;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.extra{background:linear-gradient(180deg,var(--card2),var(--bg2));border:1px solid var(--acc);border-radius:14px;padding:22px 24px;margin:26px 0 8px}
.extra h2{font-size:20px;margin-bottom:6px}
.extra ul{margin:12px 0 0 18px}.extra li{margin:8px 0;color:var(--txt2)}.extra b{color:var(--txt)}
.extra code{background:rgba(127,127,127,.14);padding:1px 6px;border-radius:5px;font-size:14px;color:var(--acc)}
footer{border-top:1px solid var(--brd2);padding:26px 0 50px;color:var(--txt3);font-size:14px;text-align:center}
@media(max-width:560px){ .sec .body{padding-left:20px} .brand{font-size:12px} }
</style>
</head>

<script>
const DATA={"pt":[{"ic":"ti-book-2","t":"Visão geral","c":"<p>O <b>Organizador de Aulas</b> organiza suas aulas em vídeo em 5 níveis, do geral para o específico:</p>\n\n<p>Exemplo: <b>HISTÓRIA</b> → <b>2° ano EM</b> → <b>Aula 12 (Revolução Francesa)</b> → <b>Cap. 01</b> → <b>vídeo do YouTube</b>.</p>\n<p>No alto de cada tela, a <b>trilha de navegação</b> (Início › Matéria › Série › Aula) mostra onde você está — toque em qualquer nível para voltar direto a ele.</p>\n<p>Tudo funciona <b>sem internet</b> e é salvo automaticamente no aparelho a cada alteração.</p>","f":[{"img":"01-inicio","leg":["Menu ☰ (Arquivo e Ajuda)","Seletor de temas","Barra do ano letivo em uso","Copiar a matéria inteira"]}]},{"ic":"ti-menu-2","t":"O menu ☰","c":"<p>O botão <b>☰</b> (canto superior esquerdo da tela inicial) abre o <b>menu</b> — é por ele que se começa a usar o app. Lá dentro estão:</p>\n<ul>\n<li><b>Projeto em uso</b> e a lista de troca rápida (até 7 anos letivos).</li>\n<li><b>Arquivo:</b> criar e gerenciar projetos, e exportar/importar o <b>backup (.json)</b>.</li>\n<li><b>Ativar / Comprar:</b> ativar a versão completa (na cópia adquirida pelo site).</li>\n<li><b>Ajuda:</b> Tutorial, <b>Modo demonstração</b>, Idioma, Privacidade, Termos de uso, Atualização e Versão.</li>\n</ul>\n<p>Para fechar o menu, toque na área escura ao lado ou no <b>✕</b>.</p>","f":[{"img":"02-menu","leg":["Gerenciar projetos (anos letivos)","Exportar backup (.json)","Aumentar o tamanho do texto"]}]},{"ic":"ti-archive","t":"Projetos — anos letivos","c":"<p>Cada <b>projeto</b> guarda um ano letivo completo (Ano + Instituição), com todas as matérias, aulas e documentos.</p>\n\n<ul>\n<li><b>Criar:</b> menu ☰ → <b>Criar novo projeto</b> → preencha <b>Ano</b> e <b>Instituição</b>. O projeto novo começa vazio e vira o projeto em uso.</li>\n<li><b>Arquivar:</b> nada se perde — o ano anterior fica guardado na lista de projetos.</li>\n<li><b>Trocar:</b> toque na barra do ano letivo (na tela inicial) ou abra o menu ☰ e toque no projeto na lista — ele vira o projeto em uso e já abre a tela de <b>Gerenciar projetos</b>. O botão <b>Gerenciar projetos</b> fica logo no topo do menu.</li>\n<li><b>Gerenciar projetos:</b> na lista, cada ano tem quatro ícones — <b>baixar</b> (exporta o backup só daquele ano), <b>lápis</b> (editar Ano e Instituição), <b>copiar</b> (duplica o ano inteiro, com tudo dentro) e <b>lixeira</b> (excluir).</li>\n<li><b>Guardar fora do aparelho:</b> use <b>Exportar backup</b> (seção Backup, mais abaixo).</li>\n</ul>","f":[{"img":"03-projetos","leg":["Baixar o backup só daquele ano","Editar Ano e Instituição","Duplicar o ano inteiro","Excluir o ano letivo"]}]},{"ic":"ti-books","t":"Matérias e séries","c":"<p>A tela inicial lista as <b>matérias</b>. Dentro de uma matéria ficam as <b>séries/anos</b> (ex.: 1°, 2° e 3° ano).</p>\n<ul>\n<li><b>Nova matéria:</b> botão grande no rodapé da tela inicial.</li>\n<li><b>Nova série:</b> abra a matéria e toque em <b>Nova série/ano</b>.</li>\n<li><b>Sugestão automática:</b> ao criar série, aula, capítulo ou projeto, o app mostra o próximo número em <b>cinza-claro</b> dentro do campo (ex.: “3° ANO” depois de “2° ANO”). Para aceitar, aperte a <b>seta → do teclado</b>; para outro valor, é só digitar por cima.</li>\n<li><b>Copiar/colar série:</b> o ícone de <b>copiar</b> no cartão da série copia a série inteira (aulas, capítulos, vídeos e anexos). Abra a matéria de destino — inclusive de <b>outro ano/projeto</b> — e toque em <b>Colar série</b>.</li>\n<li><b>Copiar matéria:</b> o ícone de <b>copiar</b> no cartão da matéria copia a matéria inteira, com todas as séries. Troque de ano letivo e toque em <b>Colar matéria</b>; para desistir de uma cópia em espera, toque no <b>✕</b> ao lado do botão Colar.</li>\n<li>Na série, o botão com a <b>setinha (nº de aulas)</b> abre a árvore resumida das aulas.</li>\n<li><b>Horas de cada série:</b> o cartão mostra três indicadores — <b>Horas totais</b> (soma da duração de todos os vídeos), <b>Ministradas</b> (capítulos já marcados como dados) e <b>Não ministradas</b> (o que ainda falta). Eles se atualizam sozinhos conforme você marca os capítulos.</li>\n<li>O ícone de <b>relatório</b> na série gera um documento Word/PDF com toda a estrutura.</li>\n<li>Os ícones de <b>lápis</b> e <b>lixeira</b> editam e removem cada item.</li>\n</ul>","f":[{"img":"04-series","leg":["Copiar a série","Relatório da série","Abrir a árvore de aulas"]}]},{"ic":"ti-player-play","t":"Aulas e capítulos","c":"<p>Dentro da série ficam as <b>aulas</b> (numeradas automaticamente) e, dentro de cada aula, os <b>capítulos</b>.</p>\n\n<ul>\n<li><b>Copiar/colar aula:</b> o ícone de <b>copiar</b> no cartão da aula copia a aula inteira (capítulos, vídeos e anexos). Abra a série de destino — pode ser de <b>outro ano/projeto</b> — e toque no botão <b>Colar aula</b> que surge no rodapé.</li>\n<li><b>Transferir várias aulas de uma vez:</b> segure o dedo por <b>2 segundos</b> numa aula, sem arrastar — cada aula ganha uma <b>caixinha de seleção</b>. Marque as que quiser e use a barra que surge no rodapé para copiá-las juntas para outra série.</li>\n<li>A <b>caixinha</b> do capítulo controla a pendência: marcada = ainda falta dar essa aula; vazia = já ministrada. Os contadores “● a ministrar” sobem para aula, série e matéria.</li>\n<li>Os <b>chips CP1…CP11</b> acendem quando o capítulo tem conteúdo; tocar num chip aceso rola até o capítulo.</li>\n<li><b>Observações:</b> cada capítulo tem uma janelinha “Observações” (recolhida por padrão) para anotações livres — lembretes, tarefas, páginas do livro. O ponto ● indica que há texto salvo.</li>\n</ul>","f":[{"img":"05-aulas","leg":["Copiar a aula"]},{"img":"06-selecao","leg":["Caixinha de seleção (segure a aula por 2 segundos)","Barra para transferir as aulas marcadas"]},{"img":"07-capitulos","leg":["Marcar o capítulo como ministrado","Fichas dos capítulos (CP)","Observações do capítulo","Abrir o vídeo"]}]},{"ic":"ti-video-off","t":"Vídeos","c":"<p>Dentro do capítulo, toque em <b>Adicionar vídeo</b>. No formulário você pode:</p>\n<ul>\n<li><b>Nome</b> do vídeo (obrigatório).</li>\n<li><b>Link do YouTube:</b> ao colar, o app preenche sozinho o <b>nome do vídeo</b> e a <b>duração</b> (precisa de internet só nessa hora). Sem link, o botão de lupa procura o vídeo pelo nome no YouTube.</li>\n<li><b>Duração</b> no campo pequeno ao lado do link (MM:SS ou H:MM:SS) — se não for detectada sozinha, preencha à mão; ela alimenta os totais de aula, série e matéria.</li>\n<li><b>Resumo</b> de até ≈3 páginas — fica numa seção recolhida abaixo do botão de busca; toque nela para abrir. Exporta em <b>Word (.doc)</b> ou <b>PDF</b>.</li>\n<li><b>Rascunho automático:</b> o que você digita neste formulário é guardado sozinho; se o app fechar sem salvar, ele oferece restaurar tudo na próxima abertura.</li>\n</ul>\n<p>Na lista, o <b>▶</b> abre o link do vídeo e os ícones ao lado do tempo mostram se há resumo, materiais ou documentos anexados.</p>","f":[{"img":"08-video","leg":["Nome do vídeo","Link do YouTube","Duração","Resumo do vídeo"]}]},{"ic":"ti-paperclip","t":"Material didático e documentos","c":"<p>No formulário do vídeo, a seção <b>“Material didático e documentos”</b> fica recolhida — toque nela para expandir.</p>\n\n<ul>\n<li><b>Materiais citados:</b> lista simples com o <b>título</b> do livro citado no vídeo. A <b>lupa</b> ao lado de cada material procura na internet uma versão <b>gratuita em PDF</b> do livro.</li>\n<li><b>Documentos anexados:</b> toque em <b>Importar PDF, imagem, Word ou áudio</b> para guardar até <b>10 arquivos por vídeo</b> (até <b>100 MB</b> cada — cabe um livro inteiro) dentro do próprio app.</li>\n<li>Cada documento tem um <b>Título</b> editável, além de <b>miniatura</b> (fotos) ou <b>selo colorido</b> (PDF, DOC, áudio) para reconhecer o tipo de longe.</li>\n<li>O <b>olhinho</b> abre PDFs e imagens na hora; arquivos Word são baixados para abrir no editor do aparelho. Se um PDF não abrir, teste outro documento — alguns arquivos já vêm com defeito de origem.</li>\n<li>O botão de <b>compartilhar</b> envia o documento por <b>WhatsApp</b>, e-mail ou qualquer outro app do aparelho.</li>\n<li>Os anexos entram no backup do projeto e saem nos relatórios.</li>\n</ul>","f":[{"img":"09-materiais","leg":["Seção Material didático e documentos","Importar PDF, imagem, Word ou áudio","Tirar foto"]}]},{"ic":"ti-undo","t":"Desfazer, Lixeira e reordenar","c":"<p>Errou ou apagou sem querer? O app tem três proteções — e ainda deixa arrastar tudo de lugar:</p>\n<ul>\n<li><b>Cartão Desfazer:</b> ao excluir qualquer item (vídeo, capítulo, aula, série, matéria ou ano letivo), um cartão aparece no <b>canto superior direito</b> por 10 segundos — toque em <b>Desfazer</b> e o item volta na hora, com tudo dentro. Se o cartão sumir, nada se perdeu: o item continua na Lixeira.</li>\n<li><b>Lixeira:</b> depois da primeira exclusão, um botão de <b>lixeira com contador</b> aparece na barra do topo. Ele guarda as <b>10 últimas exclusões</b>; toque nele e use <b>Restaurar</b> no que quiser de volta. Atenção: a lixeira é temporária — <b>fechar o app a esvazia</b>.</li>\n<li><b>Desfazer geral (↩):</b> o botão <b>↩</b> ao lado da lixeira desfaz a <b>última alteração</b>, qualquer que seja (edição, marcação de capítulo, exclusão…), passo a passo, até 30 vezes.</li>\n<li><b>Reordenar arrastando:</b> segure o dedo (meio segundo) em qualquer cartão — matéria, série, aula, capítulo, vídeo ou ano letivo — e arraste para cima ou para baixo para mudar a ordem.</li>\n</ul>","f":[{"img":"10-desfazer","leg":["Cartão Desfazer (10 segundos)","Lixeira com contador","Desfazer geral (↩)"]},{"img":"11-lixeira","leg":["Recuperar um item apagado"]}]},{"ic":"ti-palette","t":"Temas","c":"<p>O botão no canto superior direito alterna entre os 6 temas — a preferência fica salva:</p>\n<ol>\n<li><b>Claro</b> — fundo bege, vermelho terracota.</li>\n<li><b>Escuro</b> — preto OLED com néon branco.</li>\n<li><b>Prometeu</b> — HUD sci-fi ciano (assinatura do app).</li>\n<li><b>P. Vermelho</b> e <b>P. Azul</b> — variações do Prometeu.</li>\n<li><b>Sinal Noturno</b> — azul-noite com ciano e âmbar.</li>\n</ol>\n<p>Nos temas da família <b>Prometeu</b>, cada cartão vira uma <b>caixa de vidro 3D</b>: ao tocar, ela balança de leve e volta sozinha. (O efeito respeita a opção “reduzir movimento” do aparelho.)</p>"},{"ic":"ti-eye","t":"Tamanho do texto e zoom","c":"<p>Para quem prefere letras maiores:</p>\n<ul>\n<li><b>☰ → Tamanho do texto:</b> toque em <b>A+</b> para aumentar as letras e em <b>A−</b> para diminuir. São <b>4 tamanhos</b>, de 100% até 145%; a escolha fica salva. Os botões e ícones ficam no mesmo lugar, então nada sai do encaixe.</li>\n<li><b>Zoom de pinça:</b> em celulares e tablets, você também pode ampliar qualquer tela afastando dois dedos sobre ela (movimento de pinça).</li>\n</ul>"},{"ic":"ti-report","t":"Relatórios e exportações","c":"<ul>\n<li><b>Relatório da série:</b> ícone de relatório no cartão da série → Word ou PDF com aulas, capítulos, vídeos, links, observações, pendências e documentos.</li>\n<li><b>Resumo do vídeo:</b> dentro do formulário do vídeo → Word ou PDF com o texto do resumo, material didático e anexos.</li>\n<li>Para PDF, o navegador abre a tela de impressão: escolha <b>“Salvar como PDF”</b>.</li>\n<li><b>No tablet/celular:</b> salve o PDF na <b>memória interna</b> (pasta Downloads). Salvar direto no <b>cartão de memória</b> pode gerar “arquivo corrompido” — é uma limitação do Android, não do app; depois mova o arquivo para o cartão pelo app Arquivos.</li>\n</ul>"},{"ic":"ti-shield","t":"Backup e segurança dos dados","c":"<p><b>O salvamento é automático.</b> Tudo o que você digita é guardado sozinho, a cada alteração, <b>no navegador deste aparelho</b> — não existe botão “salvar”, e nada é enviado para a internet. Se o app for desinstalado ou os dados do navegador forem limpos, porém, eles se vão. Por isso, para <b>trocar de aparelho</b> ou ter uma cópia de segurança, exporte um backup:</p>\n<ul>\n<li><b>Exportar:</b> ☰ → Arquivo → <b>Exportar backup (.json)</b> — gera um arquivo com o projeto inteiro, anexos incluídos.</li>\n<li><b>Nome do arquivo:</b> <code>prometeu-&lt;ano&gt;.json</code> (por exemplo, <b>prometeu-2026.json</b>; se o projeto tiver instituição, ela entra no nome). É esse arquivo que você leva para outro aparelho.</li>\n<li><b>Onde ele fica:</b> na <b>pasta de Downloads</b> do aparelho — no <b>Windows</b>, “Downloads” (ou “Transferências”); no <b>Android</b>, “Download”; no <b>iPhone/iPad</b>, app <b>Arquivos</b> → “Transferências/Downloads”. Copie-o para o Google Drive, e-mail ou pen-drive para não perder.</li>\n<li><b>Importar:</b> ☰ → Arquivo → <b>Importar backup (.json)</b> — no aparelho novo, escolha esse arquivo e o projeto inteiro é recriado.</li>\n<li>Sugestão: exporte ao fim de cada bimestre e antes de atualizar o app.</li>\n</ul>","f":[{"img":"12-backup","leg":["Exportar backup (.json)","Importar backup (.json)"]}]},{"ic":"ti-device-tablet","t":"No tablet Samsung (Galaxy Tab S)","c":"<p>O app foi ajustado para tablets — tela cheia, <b>tela dividida</b> e <b>exibição pop-up</b> do One UI:</p>\n\n<ul>\n<li><b>Instalar no celular/tablet Android:</b> abra o site no Chrome → menu ⋮ → <b>“Instalar aplicativo”</b> (ou “Adicionar à tela inicial”). O app passa a abrir em janela própria, sem barra do navegador.</li>\n<li><b>Instalar no iPhone/iPad:</b> abra o site no <b>Safari</b> → botão <b>Compartilhar</b> (quadrado com seta) → <b>“Adicionar à Tela de Início”</b>.</li>\n<li><b>Instalar no computador (Windows):</b> abra o site no <b>Edge ou Chrome</b> e clique no <b>ícone de instalação</b> que aparece na barra de endereço — o app vira um programa com ícone no menu Iniciar.</li>\n<li><b>Tela dividida:</b> toque em <b>Recentes</b> (botão ▯|▯ ou gesto), toque no <b>ícone do app</b> no topo do cartão → <b>“Abrir em visualização em tela dividida”</b> → escolha o segundo app (ex.: YouTube). A divisória central ajusta o tamanho.</li>\n<li><b>Exibição pop-up:</b> em Recentes, toque no ícone do app → <b>“Abrir em exibição pop-up”</b> — o app vira uma janelinha flutuante sobre outro app.</li>\n<li>O layout se reorganiza sozinho em qualquer tamanho de janela. Nas Observações, a conversão de escrita à mão da caneta fica desativada (use o teclado) para evitar erros.</li>\n</ul>"},{"ic":"ti-alert-triangle","t":"Problemas comuns e soluções","c":"<p>Antes de pensar que algo quebrou, confira esta lista — a maioria dos casos tem solução simples:</p>\n<ul>\n<li><b>“Arquivo corrompido” ao salvar PDF ou backup no cartão de memória:</b> é uma limitação do Android — os aplicativos só gravam com segurança na <b>memória interna</b> do aparelho. Salve sempre na pasta <b>Downloads</b> (memória interna) e depois, se quiser, mova o arquivo para o cartão pelo app Arquivos.</li>\n<li><b>Os dados sumiram:</b> os dados vivem no navegador deste aparelho. <b>Limpar os dados do navegador/site</b> ou desinstalar o app apaga tudo. Prevenção: exporte o <b>backup (.json)</b> com frequência (☰ → Arquivo).</li>\n<li><b>A duração do vídeo não apareceu:</b> a detecção automática precisa de internet na hora em que o link é colado. Sem internet, digite a duração à mão no campo pequeno ao lado do link (MM:SS).</li>\n<li><b>O app abre com a barra do navegador em cima:</b> a instalação não terminou como aplicativo. Reinstale pelo site (Chrome → ⋮ → <b>“Instalar aplicativo”</b>) ou baixe o APK atualizado na página Comprar do site.</li>\n<li><b>Paguei e o código não chegou:</b> confira a caixa de <b>spam/lixo eletrônico</b>. Se não estiver lá, escreva para o e-mail de suporte (☰ → Ativar) informando o e-mail usado na compra.</li>\n<li><b>A tela de pagamento mostra valor maior que o anunciado:</b> o Mercado Pago às vezes sugere a “Linha de Crédito” (com juros). Volte e escolha <b>Pix</b> ou cartão comum — o valor certo aparece antes de confirmar.</li>\n<li><b>Um PDF anexado não abre:</b> alguns arquivos já vêm com defeito de origem. Teste outro documento; se os demais abrem, o problema é do arquivo, não do app.</li>\n<li><b>As letras ficaram diferentes sem internet:</b> normal — sem rede o app usa a fonte do sistema. Nada se perde.</li>\n</ul>"},{"ic":"ti-help","t":"Atualização e versão","c":"<ul>\n<li><b>☰ → Ajuda → Atualização:</b> explica como atualizar cada versão (PWA ou arquivo único) e verifica se há versão nova.</li>\n<li><b>☰ → Ajuda → Versão:</b> mostra a versão instalada e um resumo dos dados guardados.</li>\n</ul>"}],"en":[{"ic":"ti-book-2","t":"Overview","c":"<p>The <b>Lesson Organizer</b> arranges your video lessons in 5 levels, from general to specific:</p>\n\n<p>Example: <b>HISTORY</b> → <b>11th grade</b> → <b>Lesson 12 (French Revolution)</b> → <b>Chap. 01</b> → <b>YouTube video</b>.</p>\n<p>At the top of every screen, the <b>breadcrumb trail</b> (Home › Subject › Grade › Lesson) shows where you are — tap any level to jump straight back to it.</p>\n<p>Everything works <b>without internet</b> and is saved automatically on the device after every change.</p>","f":[{"img":"01-inicio","leg":["☰ menu (File and Help)","Theme selector","Current school-year bar","Copy the whole subject"]}]},{"ic":"ti-menu-2","t":"The ☰ menu","c":"<p>The <b>☰</b> button (top-left of the home screen) opens the <b>menu</b> — the app's starting point. Inside you'll find:</p>\n<ul>\n<li><b>Current project</b> and the quick-switch list (up to 7 school years).</li>\n<li><b>File:</b> create and manage projects, and export/import the <b>backup (.json)</b>.</li>\n<li><b>Activate / Buy:</b> unlock the full version (in the copy bought from the website).</li>\n<li><b>Help:</b> Tutorial, <b>Demo mode</b>, Language, Privacy, Terms of use, Updates and Version.</li>\n</ul>\n<p>To close the menu, tap the dark area beside it or the <b>✕</b>.</p>","f":[{"img":"02-menu","leg":["Manage projects (school years)","Export backup (.json)","Increase the text size"]}]},{"ic":"ti-archive","t":"Projects — school years","c":"<p>Each <b>project</b> holds a full school year (Year + Institution), with all subjects, lessons and documents.</p>\n\n<ul>\n<li><b>Create:</b> menu ☰ → <b>Create new project</b> → fill in <b>Year</b> and <b>Institution</b>. The new project starts empty and becomes the current one.</li>\n<li><b>Archive:</b> nothing is lost — the previous year stays in the project list.</li>\n<li><b>Switch:</b> tap the school-year bar (home screen), or open the ☰ menu and tap a project in the list — it becomes the current project and opens the <b>Manage projects</b> screen. The <b>Manage projects</b> button sits right at the top of the menu.</li>\n<li><b>Manage projects:</b> in the list, each year has four icons — <b>download</b> (exports the backup of that year only), <b>pencil</b> (edit Year and Institution), <b>copy</b> (duplicates the whole year, with everything inside) and <b>trash</b> (delete).</li>\n<li><b>Keep a copy off the device:</b> use <b>Export backup</b> (Backup section below).</li>\n</ul>","f":[{"img":"03-projetos","leg":["Download that year’s backup only","Edit Year and Institution","Duplicate the whole year","Delete the school year"]}]},{"ic":"ti-books","t":"Subjects and grades","c":"<p>The home screen lists your <b>subjects</b>. Inside a subject live the <b>grades/years</b> (e.g. 10th, 11th and 12th grade).</p>\n<ul>\n<li><b>New subject:</b> big button at the bottom of the home screen.</li>\n<li><b>New grade:</b> open the subject and tap <b>New grade/year</b>.</li>\n<li><b>Automatic suggestion:</b> when creating a grade, lesson, chapter or project, the app shows the next number in <b>light grey</b> inside the field (e.g. “12th grade” after “11th grade”). To accept it, press the <b>right-arrow → key</b>; for a different value, just type over it.</li>\n<li><b>Copy/paste a grade:</b> the <b>copy</b> icon on the grade card copies the whole grade (lessons, chapters, videos and attachments). Open the target subject — even in <b>another year/project</b> — and tap <b>Paste grade</b>.</li>\n<li><b>Copy a subject:</b> the <b>copy</b> icon on the subject card copies the entire subject, with all its grades. Switch to another school year and tap <b>Paste subject</b>; to cancel a pending copy, tap the <b>✕</b> next to the Paste button.</li>\n<li>In the grade card, the <b>arrow button (lesson count)</b> opens a compact tree of the lessons.</li>\n<li><b>Hours per grade:</b> the card shows three indicators — <b>Total hours</b> (sum of all video durations), <b>Taught</b> (chapters already marked as done) and <b>Not taught</b> (what's still left). They update automatically as you check off chapters.</li>\n<li>The <b>report</b> icon on the grade generates a Word/PDF document with the whole structure.</li>\n<li>The <b>pencil</b> and <b>trash</b> icons edit and delete each item.</li>\n</ul>","f":[{"img":"04-series","leg":["Copy the grade","Grade report","Open the lesson tree"]}]},{"ic":"ti-player-play","t":"Lessons and chapters","c":"<p>Inside the grade are the <b>lessons</b> (numbered automatically) and, inside each lesson, the <b>chapters</b>.</p>\n\n<ul>\n<li><b>Copy/paste a lesson:</b> the <b>copy</b> icon on the lesson card copies the whole lesson (chapters, videos and attachments). Open the target grade — it can be in <b>another year/project</b> — and tap the <b>Paste lesson</b> button that appears at the bottom.</li>\n<li><b>Transfer several lessons at once:</b> press and hold a lesson for <b>2 seconds</b>, without dragging — every lesson gets a <b>checkbox</b>. Tick the ones you want and use the bar that appears at the bottom to copy them together to another grade.</li>\n<li>The chapter <b>checkbox</b> controls the pending state: checked = still to be taught; empty = already taught. The “● to teach” counters roll up to lesson, grade and subject.</li>\n<li>The <b>CP1…CP11 chips</b> light up when a chapter has content; tapping a lit chip scrolls to that chapter.</li>\n<li><b>Notes:</b> each chapter has a small “Notes” panel (collapsed by default) for free-form notes — reminders, tasks, book pages. The ● dot shows there is saved text.</li>\n</ul>","f":[{"img":"05-aulas","leg":["Copy the lesson"]},{"img":"06-selecao","leg":["Selection checkbox (hold the lesson for 2 seconds)","Bar to transfer the checked lessons"]},{"img":"07-capitulos","leg":["Mark the chapter as taught","Chapter chips (CP)","Chapter notes","Open the video"]}]},{"ic":"ti-video-off","t":"Videos","c":"<p>Inside a chapter, tap <b>Add video</b>. In the form you can set:</p>\n<ul>\n<li>The video <b>name</b> (required).</li>\n<li><b>YouTube link:</b> when pasted, the app fills in the <b>video name</b> and the <b>duration</b> automatically (internet needed only at that moment). Without a link, the magnifier button searches YouTube by name.</li>\n<li><b>Duration</b> in the small field next to the link (MM:SS or H:MM:SS) — if it isn't detected automatically, fill it in by hand; it feeds the totals for lesson, grade and subject.</li>\n<li>A <b>summary</b> of up to ≈3 pages — it sits in a collapsed section below the search button; tap it to open. Exportable as <b>Word (.doc)</b> or <b>PDF</b>.</li>\n<li><b>Automatic draft:</b> whatever you type in this form is saved on its own; if the app closes before you save, it offers to restore everything on the next launch.</li>\n</ul>\n<p>In the list, <b>▶</b> opens the video link, and the icons next to the time show whether there is a summary, materials or attached documents.</p>","f":[{"img":"08-video","leg":["Video name","YouTube link","Duration","Video summary"]}]},{"ic":"ti-paperclip","t":"Teaching materials and documents","c":"<p>In the video form, the <b>“Teaching materials & documents”</b> section starts collapsed — tap it to expand.</p>\n\n<ul>\n<li><b>Cited materials:</b> a simple list with the <b>title</b> of the book mentioned in the video. The <b>magnifier</b> next to each material searches the internet for a <b>free PDF</b> version of the book.</li>\n<li><b>Attached documents:</b> tap <b>Import PDF, image, Word or audio</b> to store up to <b>10 files per video</b> (up to <b>100 MB</b> each — enough for a whole book) inside the app itself.</li>\n<li>Each document has an editable <b>Title</b>, plus a <b>thumbnail</b> (photos) or a <b>colored badge</b> (PDF, DOC, audio) so you can spot the type at a glance.</li>\n<li>The <b>eye</b> opens PDFs and images right away; Word files are downloaded to open in the device's editor. If a PDF won't open, try another document — some files are corrupted at the source.</li>\n<li>The <b>share</b> button sends the document via <b>WhatsApp</b>, e-mail or any other app on the device.</li>\n<li>Attachments are included in project backups and in reports.</li>\n</ul>","f":[{"img":"09-materiais","leg":["Teaching material and documents section","Import PDF, image, Word or audio","Take a photo"]}]},{"ic":"ti-undo","t":"Undo, Trash and reordering","c":"<p>Made a mistake or deleted something by accident? The app has three safety nets — and lets you drag everything into place:</p>\n<ul>\n<li><b>Undo card:</b> when you delete any item (video, chapter, lesson, grade, subject or school year), a card appears in the <b>top-right corner</b> for 10 seconds — tap <b>Undo</b> and the item comes right back, with everything inside. If the card disappears, nothing is lost: the item is still in the Trash.</li>\n<li><b>Trash:</b> after the first deletion, a <b>trash button with a counter</b> appears in the top bar. It keeps the <b>last 10 deletions</b>; tap it and use <b>Restore</b> on whatever you want back. Note: the trash is temporary — <b>closing the app empties it</b>.</li>\n<li><b>General undo (↩):</b> the <b>↩</b> button next to the trash undoes the <b>last change</b>, whatever it was (an edit, a chapter checkbox, a deletion…), step by step, up to 30 times.</li>\n<li><b>Reorder by dragging:</b> press and hold (half a second) any card — subject, grade, lesson, chapter, video or school year — and drag it up or down to change the order.</li>\n</ul>","f":[{"img":"10-desfazer","leg":["Undo card (10 seconds)","Trash with counter","General undo (↩)"]},{"img":"11-lixeira","leg":["Restore a deleted item"]}]},{"ic":"ti-palette","t":"Themes","c":"<p>The button in the top-right corner cycles through the 6 themes — the preference is saved:</p>\n<ol>\n<li><b>Light</b> — beige background, terracotta red.</li>\n<li><b>Dark</b> — OLED black with white neon.</li>\n<li><b>Prometheus</b> — cyan sci-fi HUD (the app's signature).</li>\n<li><b>P. Red</b> and <b>P. Blue</b> — Prometheus variations.</li>\n<li><b>Sinal Noturno</b> — night blue with cyan and amber.</li>\n</ol>\n<p>In the <b>Prometheus</b>-family themes, each card becomes a <b>3D glass box</b>: tap it and it sways gently, then settles back on its own. (The effect honours the device's “reduce motion” setting.)</p>"},{"ic":"ti-eye","t":"Text size and zoom","c":"<p>If you prefer bigger text:</p>\n<ul>\n<li><b>☰ → Text size:</b> tap <b>A+</b> to enlarge the text and <b>A−</b> to shrink it. There are <b>4 sizes</b>, from 100% up to 145%; the choice is saved. Buttons and icons stay put, so nothing falls out of place.</li>\n<li><b>Pinch zoom:</b> on phones and tablets you can also zoom into any screen by spreading two fingers on it (pinch gesture).</li>\n</ul>"},{"ic":"ti-report","t":"Reports and exports","c":"<ul>\n<li><b>Grade report:</b> report icon on the grade card → Word or PDF with lessons, chapters, videos, links, notes, pending items and documents.</li>\n<li><b>Video summary:</b> inside the video form → Word or PDF with the summary text, teaching materials and attachments.</li>\n<li>For PDF, the browser opens the print dialog: choose <b>“Save as PDF”</b>.</li>\n<li><b>On a tablet/phone:</b> save the PDF to <b>internal storage</b> (Downloads folder). Saving straight to the <b>memory card</b> may produce a “corrupted file” — an Android limitation, not the app’s; move the file to the card later with the Files app.</li>\n</ul>"},{"ic":"ti-shield","t":"Backup and data safety","c":"<p><b>Saving is automatic.</b> Everything you type is stored on its own, on every change, <b>in this device's browser</b> — there is no “save” button, and nothing is sent to the internet. But if the app is uninstalled or the browser data is cleared, it is gone. So, to <b>switch devices</b> or keep a safety copy, export a backup:</p>\n<ul>\n<li><b>Export:</b> ☰ → File → <b>Export backup (.json)</b> — creates a file with the whole project, attachments included.</li>\n<li><b>File name:</b> <code>prometeu-&lt;year&gt;.json</code> (for example, <b>prometeu-2026.json</b>; if the project has an institution, it's added to the name). This is the file you take to another device.</li>\n<li><b>Where it goes:</b> to the device's <b>Downloads folder</b> — on <b>Windows</b>, “Downloads”; on <b>Android</b>, “Download”; on <b>iPhone/iPad</b>, the <b>Files</b> app → “Downloads”. Copy it to Google Drive, e-mail or a USB stick so you don't lose it.</li>\n<li><b>Import:</b> ☰ → File → <b>Import backup (.json)</b> — on the new device, pick that file and the whole project is recreated.</li>\n<li>Suggestion: export at the end of each term and before updating the app.</li>\n</ul>","f":[{"img":"12-backup","leg":["Export backup (.json)","Import backup (.json)"]}]},{"ic":"ti-device-tablet","t":"On a Samsung tablet (Galaxy Tab S)","c":"<p>The app is tuned for tablets — full screen, One UI <b>split screen</b> and <b>pop-up view</b>:</p>\n\n<ul>\n<li><b>Install on an Android phone/tablet:</b> open the site in Chrome → ⋮ menu → <b>“Install app”</b> (or “Add to home screen”). The app then opens in its own window, without the browser bar.</li>\n<li><b>Install on iPhone/iPad:</b> open the site in <b>Safari</b> → <b>Share</b> button (square with arrow) → <b>“Add to Home Screen”</b>.</li>\n<li><b>Install on a computer (Windows):</b> open the site in <b>Edge or Chrome</b> and click the <b>install icon</b> in the address bar — the app becomes a program with an icon in the Start menu.</li>\n<li><b>Split screen:</b> tap <b>Recents</b>, tap the <b>app icon</b> at the top of the card → <b>“Open in split screen view”</b> → choose the second app (e.g. YouTube). The middle divider adjusts the size.</li>\n<li><b>Pop-up view:</b> in Recents, tap the app icon → <b>“Open in pop-up view”</b> — the app becomes a floating window over another app.</li>\n<li>The layout reorganizes itself at any window size. In the Notes field, stylus handwriting-to-text is disabled (use the keyboard) to avoid conversion errors.</li>\n</ul>"},{"ic":"ti-alert-triangle","t":"Common problems and solutions","c":"<p>Before assuming something broke, check this list — most cases have a simple fix:</p>\n<ul>\n<li><b>“Corrupted file” when saving a PDF or backup to the memory card:</b> an Android limitation — apps can only write reliably to the device's <b>internal storage</b>. Always save to the <b>Downloads</b> folder (internal storage) and, if you wish, move the file to the card later with the Files app.</li>\n<li><b>My data disappeared:</b> your data lives in this device's browser. <b>Clearing the browser/site data</b> or uninstalling the app erases everything. Prevention: export the <b>backup (.json)</b> often (☰ → File).</li>\n<li><b>The video duration didn't appear:</b> automatic detection needs internet at the moment the link is pasted. Offline, type the duration manually in the small field next to the link (MM:SS).</li>\n<li><b>The app opens with a browser bar on top:</b> the installation didn't finish as an app. Reinstall from the site (Chrome → ⋮ → <b>“Install app”</b>) or download the updated APK from the site's Buy page.</li>\n<li><b>I paid but the code didn't arrive:</b> check your <b>spam/junk</b> folder. If it's not there, write to the support e-mail (☰ → Activate) mentioning the e-mail used in the purchase.</li>\n<li><b>The payment screen shows a higher amount than advertised:</b> Mercado Pago sometimes suggests its “credit line” (with interest). Go back and choose <b>Pix</b> or a regular card — the right amount shows before you confirm.</li>\n<li><b>An attached PDF won't open:</b> some files are already damaged at the source. Try another document; if the others open, the problem is the file, not the app.</li>\n<li><b>The fonts look different offline:</b> normal — without internet the app falls back to the system font. Nothing is lost.</li>\n</ul>"},{"ic":"ti-help","t":"Updates and version","c":"<ul>\n<li><b>☰ → Help → Updates:</b> explains how to update each version (PWA or single file) and checks whether a new version exists.</li>\n<li><b>☰ → Help → Version:</b> shows the installed version and a summary of the stored data.</li>\n</ul>"}],"es":[{"ic":"ti-book-2","t":"Visión general","c":"<p>El <b>Organizador de Clases</b> organiza tus clases en vídeo en 5 niveles, de lo general a lo específico:</p>\n\n<p>Ejemplo: <b>HISTORIA</b> → <b>2.º de bachillerato</b> → <b>Clase 12 (Revolución Francesa)</b> → <b>Cap. 01</b> → <b>vídeo de YouTube</b>.</p>\n<p>En la parte superior de cada pantalla, la <b>ruta de navegación</b> (Inicio › Asignatura › Curso › Clase) muestra dónde estás — toca cualquier nivel para volver directamente a él.</p>\n<p>Todo funciona <b>sin internet</b> y se guarda automáticamente en el dispositivo con cada cambio.</p>","f":[{"img":"01-inicio","leg":["Menú ☰ (Archivo y Ayuda)","Selector de temas","Barra del año lectivo en uso","Copiar la asignatura entera"]}]},{"ic":"ti-menu-2","t":"El menú ☰","c":"<p>El botón <b>☰</b> (arriba a la izquierda de la pantalla inicial) abre el <b>menú</b> — el punto de partida de la app. Dentro encontrarás:</p>\n<ul>\n<li><b>Proyecto en uso</b> y la lista de cambio rápido (hasta 7 años lectivos).</li>\n<li><b>Archivo:</b> crear y gestionar proyectos, y exportar/importar la <b>copia (.json)</b>.</li>\n<li><b>Activar / Comprar:</b> desbloquear la versión completa (en la copia adquirida desde el sitio web).</li>\n<li><b>Ayuda:</b> Tutorial, <b>Modo demostración</b>, Idioma, Privacidad, Términos de uso, Actualización y Versión.</li>\n</ul>\n<p>Para cerrar el menú, toca el área oscura al lado o la <b>✕</b>.</p>","f":[{"img":"02-menu","leg":["Gestionar proyectos (años lectivos)","Exportar copia de seguridad (.json)","Aumentar el tamaño del texto"]}]},{"ic":"ti-archive","t":"Proyectos — años lectivos","c":"<p>Cada <b>proyecto</b> guarda un año lectivo completo (Año + Institución), con todas las asignaturas, clases y documentos.</p>\n\n<ul>\n<li><b>Crear:</b> menú ☰ → <b>Crear nuevo proyecto</b> → rellena <b>Año</b> e <b>Institución</b>. El proyecto nuevo empieza vacío y pasa a ser el actual.</li>\n<li><b>Archivar:</b> no se pierde nada — el año anterior queda guardado en la lista de proyectos.</li>\n<li><b>Cambiar:</b> toca la barra del año lectivo (pantalla inicial), o abre el menú ☰ y toca un proyecto de la lista — pasa a ser el proyecto en uso y abre la pantalla de <b>Gestionar proyectos</b>. El botón <b>Gestionar proyectos</b> está justo arriba en el menú.</li>\n<li><b>Gestionar proyectos:</b> en la lista, cada año tiene cuatro iconos — <b>descargar</b> (exporta la copia solo de ese año), <b>lápiz</b> (editar Año e Institución), <b>copiar</b> (duplica el año entero, con todo dentro) y <b>papelera</b> (eliminar).</li>\n<li><b>Guardar fuera del dispositivo:</b> usa <b>Exportar copia de seguridad</b> (sección más abajo).</li>\n</ul>","f":[{"img":"03-projetos","leg":["Descargar la copia solo de ese año","Editar Año e Institución","Duplicar el año entero","Eliminar el año lectivo"]}]},{"ic":"ti-books","t":"Asignaturas y cursos","c":"<p>La pantalla inicial lista las <b>asignaturas</b>. Dentro de cada asignatura viven los <b>cursos/años</b> (p. ej. 1.º, 2.º y 3.º).</p>\n<ul>\n<li><b>Nueva asignatura:</b> botón grande al pie de la pantalla inicial.</li>\n<li><b>Nuevo curso:</b> abre la asignatura y toca <b>Nuevo curso/año</b>.</li>\n<li><b>Sugerencia automática:</b> al crear un curso, clase, capítulo o proyecto, la app muestra el siguiente número en <b>gris claro</b> dentro del campo (p. ej. “3.º curso” tras “2.º curso”). Para aceptarlo, pulsa la <b>tecla de flecha → derecha</b>; para otro valor, basta con escribir encima.</li>\n<li><b>Copiar/pegar un curso:</b> el icono de <b>copiar</b> en la tarjeta del curso copia el curso entero (clases, capítulos, vídeos y adjuntos). Abre la asignatura de destino — incluso de <b>otro año/proyecto</b> — y toca <b>Pegar curso</b>.</li>\n<li><b>Copiar una asignatura:</b> el icono de <b>copiar</b> en la tarjeta de la asignatura copia la asignatura entera, con todos sus cursos. Cambia de año lectivo y toca <b>Pegar asignatura</b>; para cancelar una copia en espera, toca la <b>✕</b> junto al botón Pegar.</li>\n<li>En el curso, el botón con la <b>flecha (n.º de clases)</b> abre el árbol resumido de las clases.</li>\n<li><b>Horas de cada curso:</b> la tarjeta muestra tres indicadores — <b>Horas totales</b> (suma de la duración de todos los vídeos), <b>Impartidas</b> (capítulos ya marcados como dados) y <b>No impartidas</b> (lo que aún falta). Se actualizan solos a medida que marcas los capítulos.</li>\n<li>El icono de <b>informe</b> del curso genera un documento Word/PDF con toda la estructura.</li>\n<li>Los iconos de <b>lápiz</b> y <b>papelera</b> editan y eliminan cada elemento.</li>\n</ul>","f":[{"img":"04-series","leg":["Copiar la serie","Informe de la serie","Abrir el árbol de clases"]}]},{"ic":"ti-player-play","t":"Clases y capítulos","c":"<p>Dentro del curso están las <b>clases</b> (numeradas automáticamente) y, dentro de cada clase, los <b>capítulos</b>.</p>\n\n<ul>\n<li><b>Copiar/pegar una clase:</b> el icono de <b>copiar</b> en la tarjeta de la clase copia la clase entera (capítulos, vídeos y adjuntos). Abre el curso de destino — puede ser de <b>otro año/proyecto</b> — y toca el botón <b>Pegar clase</b> que aparece abajo.</li>\n<li><b>Transferir varias clases a la vez:</b> mantén pulsada una clase durante <b>2 segundos</b>, sin arrastrar — cada clase muestra una <b>casilla de selección</b>. Marca las que quieras y usa la barra que aparece abajo para copiarlas juntas a otro curso.</li>\n<li>La <b>casilla</b> del capítulo controla lo pendiente: marcada = aún falta impartirlo; vacía = ya impartido. Los contadores “● por impartir” suben a clase, curso y asignatura.</li>\n<li>Los <b>chips CP1…CP11</b> se encienden cuando el capítulo tiene contenido; tocar un chip encendido desplaza hasta ese capítulo.</li>\n<li><b>Notas:</b> cada capítulo tiene un panel “Notas” (plegado por defecto) para anotaciones libres — recordatorios, tareas, páginas del libro. El punto ● indica que hay texto guardado.</li>\n</ul>","f":[{"img":"05-aulas","leg":["Copiar la clase"]},{"img":"06-selecao","leg":["Casilla de selección (mantén pulsada la clase 2 segundos)","Barra para transferir las clases marcadas"]},{"img":"07-capitulos","leg":["Marcar el capítulo como impartido","Fichas de los capítulos (CP)","Notas del capítulo","Abrir el vídeo"]}]},{"ic":"ti-video-off","t":"Vídeos","c":"<p>Dentro del capítulo, toca <b>Añadir vídeo</b>. En el formulario puedes indicar:</p>\n<ul>\n<li>El <b>nombre</b> del vídeo (obligatorio).</li>\n<li><b>Enlace de YouTube:</b> al pegarlo, la app rellena sola el <b>nombre del vídeo</b> y la <b>duración</b> (internet solo en ese momento). Sin enlace, el botón de lupa busca el vídeo por nombre en YouTube.</li>\n<li><b>Duración</b> en el campo pequeño junto al enlace (MM:SS o H:MM:SS) — si no se detecta sola, rellénala a mano; alimenta los totales de clase, curso y asignatura.</li>\n<li>Un <b>resumen</b> de hasta ≈3 páginas — está en una sección plegada bajo el botón de búsqueda; tócala para abrirla. Se exporta en <b>Word (.doc)</b> o <b>PDF</b>.</li>\n<li><b>Borrador automático:</b> lo que escribes en este formulario se guarda solo; si la app se cierra sin guardar, ofrece restaurarlo todo en la próxima apertura.</li>\n</ul>\n<p>En la lista, <b>▶</b> abre el enlace del vídeo y los iconos junto al tiempo muestran si hay resumen, materiales o documentos adjuntos.</p>","f":[{"img":"08-video","leg":["Nombre del vídeo","Enlace de YouTube","Duración","Resumen del vídeo"]}]},{"ic":"ti-paperclip","t":"Material didáctico y documentos","c":"<p>En el formulario del vídeo, la sección <b>«Material didáctico y documentos»</b> está plegada — tócala para expandirla.</p>\n\n<ul>\n<li><b>Materiales citados:</b> lista simple con el <b>título</b> del libro citado en el vídeo. La <b>lupa</b> junto a cada material busca en internet una versión <b>gratuita en PDF</b> del libro.</li>\n<li><b>Documentos adjuntos:</b> toca <b>Importar PDF, imagen, Word o audio</b> para guardar hasta <b>10 archivos por vídeo</b> (hasta <b>100 MB</b> cada uno — cabe un libro entero) dentro de la propia app.</li>\n<li>Cada documento tiene un <b>Título</b> editable, además de una <b>miniatura</b> (fotos) o un <b>sello de color</b> (PDF, DOC, audio) para reconocer el tipo de un vistazo.</li>\n<li>El <b>ojo</b> abre PDF e imágenes al momento; los archivos Word se descargan para abrirlos en el editor del dispositivo. Si un PDF no se abre, prueba con otro documento — algunos archivos vienen dañados de origen.</li>\n<li>El botón de <b>compartir</b> envía el documento por <b>WhatsApp</b>, correo o cualquier otra app del dispositivo.</li>\n<li>Los adjuntos entran en la copia de seguridad del proyecto y salen en los informes.</li>\n</ul>","f":[{"img":"09-materiais","leg":["Sección Material didáctico y documentos","Importar PDF, imagen, Word o audio","Tomar una foto"]}]},{"ic":"ti-undo","t":"Deshacer, Papelera y reordenar","c":"<p>¿Te equivocaste o borraste algo sin querer? La app tiene tres protecciones — y además deja arrastrarlo todo de sitio:</p>\n<ul>\n<li><b>Tarjeta Deshacer:</b> al eliminar cualquier elemento (vídeo, capítulo, clase, curso, asignatura o año lectivo), aparece una tarjeta en la <b>esquina superior derecha</b> durante 10 segundos — toca <b>Deshacer</b> y el elemento vuelve al instante, con todo dentro. Si la tarjeta desaparece, no se pierde nada: el elemento sigue en la Papelera.</li>\n<li><b>Papelera:</b> tras la primera eliminación, aparece un <b>botón de papelera con contador</b> en la barra superior. Guarda las <b>últimas 10 eliminaciones</b>; tócalo y usa <b>Restaurar</b> en lo que quieras recuperar. Ojo: la papelera es temporal — <b>cerrar la app la vacía</b>.</li>\n<li><b>Deshacer general (↩):</b> el botón <b>↩</b> junto a la papelera deshace el <b>último cambio</b>, sea cual sea (una edición, la casilla de un capítulo, una eliminación…), paso a paso, hasta 30 veces.</li>\n<li><b>Reordenar arrastrando:</b> mantén pulsada (medio segundo) cualquier tarjeta — asignatura, curso, clase, capítulo, vídeo o año lectivo — y arrástrala arriba o abajo para cambiar el orden.</li>\n</ul>","f":[{"img":"10-desfazer","leg":["Tarjeta Deshacer (10 segundos)","Papelera con contador","Deshacer general (↩)"]},{"img":"11-lixeira","leg":["Recuperar un elemento borrado"]}]},{"ic":"ti-palette","t":"Temas","c":"<p>El botón de la esquina superior derecha alterna entre los 6 temas — la preferencia queda guardada:</p>\n<ol>\n<li><b>Claro</b> — fondo beige, rojo terracota.</li>\n<li><b>Oscuro</b> — negro OLED con neón blanco.</li>\n<li><b>Prometeo</b> — HUD de ciencia ficción cian (la firma de la app).</li>\n<li><b>P. Rojo</b> y <b>P. Azul</b> — variaciones del Prometeo.</li>\n<li><b>Sinal Noturno</b> — azul nocturno con cian y ámbar.</li>\n</ol>\n<p>En los temas de la familia <b>Prometeo</b>, cada tarjeta se convierte en una <b>caja de cristal 3D</b>: al tocarla, se balancea suavemente y vuelve sola. (El efecto respeta la opción “reducir movimiento” del dispositivo.)</p>"},{"ic":"ti-eye","t":"Tamaño del texto y zoom","c":"<p>Para quien prefiere letras más grandes:</p>\n<ul>\n<li><b>☰ → Tamaño del texto:</b> toca <b>A+</b> para agrandar las letras y <b>A−</b> para reducirlas. Hay <b>4 tamaños</b>, del 100% hasta el 145%; la elección queda guardada. Los botones y los iconos se quedan en su sitio, así que nada se descoloca.</li>\n<li><b>Zoom de pellizco:</b> en móviles y tabletas también puedes ampliar cualquier pantalla separando dos dedos sobre ella (gesto de pellizco).</li>\n</ul>"},{"ic":"ti-report","t":"Informes y exportaciones","c":"<ul>\n<li><b>Informe del curso:</b> icono de informe en la tarjeta del curso → Word o PDF con clases, capítulos, vídeos, enlaces, notas, pendientes y documentos.</li>\n<li><b>Resumen del vídeo:</b> dentro del formulario del vídeo → Word o PDF con el texto del resumen, material didáctico y adjuntos.</li>\n<li>Para PDF, el navegador abre el diálogo de impresión: elige <b>«Guardar como PDF»</b>.</li>\n<li><b>En tablet/móvil:</b> guarda el PDF en la <b>memoria interna</b> (carpeta Descargas). Guardar directo en la <b>tarjeta de memoria</b> puede generar un «archivo dañado» — es una limitación de Android, no de la app; luego mueve el archivo a la tarjeta con la app Archivos.</li>\n</ul>"},{"ic":"ti-shield","t":"Copia de seguridad y protección de datos","c":"<p><b>El guardado es automático.</b> Todo lo que escribes se guarda solo, en cada cambio, <b>en el navegador de este dispositivo</b> — no hay botón de “guardar” y nada se envía a internet. Pero si desinstalas la app o borras los datos del navegador, desaparecen. Por eso, para <b>cambiar de dispositivo</b> o tener una copia de seguridad, exporta una copia:</p>\n<ul>\n<li><b>Exportar:</b> ☰ → Archivo → <b>Exportar copia (.json)</b> — genera un archivo con el proyecto entero, adjuntos incluidos.</li>\n<li><b>Nombre del archivo:</b> <code>prometeu-&lt;año&gt;.json</code> (por ejemplo, <b>prometeu-2026.json</b>; si el proyecto tiene institución, se añade al nombre). Es el archivo que llevas a otro dispositivo.</li>\n<li><b>Dónde queda:</b> en la <b>carpeta de Descargas</b> del dispositivo — en <b>Windows</b>, “Descargas”; en <b>Android</b>, “Download”; en <b>iPhone/iPad</b>, la app <b>Archivos</b> → “Descargas”. Cópialo a Google Drive, correo o USB para no perderlo.</li>\n<li><b>Importar:</b> ☰ → Archivo → <b>Importar copia (.json)</b> — en el dispositivo nuevo, elige ese archivo y se recrea el proyecto entero.</li>\n<li>Sugerencia: exporta al final de cada trimestre y antes de actualizar la app.</li>\n</ul>","f":[{"img":"12-backup","leg":["Exportar copia de seguridad (.json)","Importar copia de seguridad (.json)"]}]},{"ic":"ti-device-tablet","t":"En una tableta Samsung (Galaxy Tab S)","c":"<p>La app está ajustada para tabletas — pantalla completa, <b>pantalla dividida</b> y <b>vista emergente</b> de One UI:</p>\n\n<ul>\n<li><b>Instalar en un móvil/tablet Android:</b> abre el sitio en Chrome → menú ⋮ → <b>«Instalar aplicación»</b> (o «Añadir a pantalla de inicio»). La app pasa a abrirse en su propia ventana, sin barra del navegador.</li>\n<li><b>Instalar en iPhone/iPad:</b> abre el sitio en <b>Safari</b> → botón <b>Compartir</b> (cuadrado con flecha) → <b>«Añadir a pantalla de inicio»</b>.</li>\n<li><b>Instalar en el ordenador (Windows):</b> abre el sitio en <b>Edge o Chrome</b> y haz clic en el <b>icono de instalación</b> de la barra de direcciones — la app se convierte en un programa con icono en el menú Inicio.</li>\n<li><b>Pantalla dividida:</b> toca <b>Recientes</b>, toca el <b>icono de la app</b> en la parte superior de la tarjeta → <b>«Abrir en vista de pantalla dividida»</b> → elige la segunda app (p. ej. YouTube).</li>\n<li><b>Vista emergente:</b> en Recientes, toca el icono de la app → <b>«Abrir en vista emergente»</b> — la app se convierte en una ventana flotante sobre otra app.</li>\n<li>El diseño se reorganiza solo en cualquier tamaño de ventana. En las Notas, la escritura a mano del lápiz queda desactivada (usa el teclado) para evitar errores de conversión.</li>\n</ul>"},{"ic":"ti-alert-triangle","t":"Problemas comunes y soluciones","c":"<p>Antes de pensar que algo se rompió, revisa esta lista — la mayoría de los casos tiene solución simple:</p>\n<ul>\n<li><b>“Archivo dañado” al guardar un PDF o copia de seguridad en la tarjeta de memoria:</b> es una limitación de Android — las aplicaciones solo escriben con seguridad en el <b>almacenamiento interno</b> del dispositivo. Guarda siempre en la carpeta <b>Descargas</b> (almacenamiento interno) y, si quieres, mueve el archivo a la tarjeta después con la app Archivos.</li>\n<li><b>Mis datos desaparecieron:</b> los datos viven en el navegador de este dispositivo. <b>Borrar los datos del navegador/sitio</b> o desinstalar la app lo elimina todo. Prevención: exporta la <b>copia de seguridad (.json)</b> con frecuencia (☰ → Archivo).</li>\n<li><b>La duración del vídeo no apareció:</b> la detección automática necesita internet en el momento de pegar el enlace. Sin internet, escribe la duración a mano en el campo pequeño junto al enlace (MM:SS).</li>\n<li><b>La app se abre con una barra de navegador arriba:</b> la instalación no terminó como aplicación. Reinstala desde el sitio (Chrome → ⋮ → <b>“Instalar aplicación”</b>) o descarga el APK actualizado en la página Comprar del sitio.</li>\n<li><b>Pagué y el código no llegó:</b> revisa la carpeta de <b>spam/correo no deseado</b>. Si no está ahí, escribe al correo de soporte (☰ → Activar) indicando el correo usado en la compra.</li>\n<li><b>La pantalla de pago muestra un valor mayor que el anunciado:</b> Mercado Pago a veces sugiere su “línea de crédito” (con intereses). Vuelve atrás y elige <b>Pix</b> o tarjeta común — el valor correcto aparece antes de confirmar.</li>\n<li><b>Un PDF adjunto no se abre:</b> algunos archivos ya vienen dañados de origen. Prueba con otro documento; si los demás se abren, el problema es del archivo, no de la app.</li>\n<li><b>Las letras se ven diferentes sin internet:</b> es normal — sin red la app usa la fuente del sistema. No se pierde nada.</li>\n</ul>"},{"ic":"ti-help","t":"Actualización y versión","c":"<ul>\n<li><b>☰ → Ayuda → Actualización:</b> explica cómo actualizar cada versión (PWA o archivo único) y comprueba si hay una nueva.</li>\n<li><b>☰ → Ayuda → Versión:</b> muestra la versión instalada y un resumen de los datos guardados.</li>\n</ul>"}],"zh":[{"ic":"ti-book-2","t":"概览","c":"<p><b>课程管理器</b>将你的视频课程按 5 个层级组织，从整体到具体：</p>\n\n<p>示例：<b>历史</b> → <b>高二</b> → <b>第 12 课（法国大革命）</b> → <b>第 1 章</b> → <b>YouTube 视频</b>。</p>\n<p>每个屏幕顶部都有<b>导航路径</b>（首页 › 科目 › 年级 › 课程），显示你当前的位置——点按任一层级即可直接返回。</p>\n<p>一切<b>无需网络</b>即可使用，每次更改都会自动保存在设备上。</p>","f":[{"img":"01-inicio","leg":["☰ 菜单（文件与帮助）","主题选择器","当前学年栏","复制整个科目"]}]},{"ic":"ti-menu-2","t":"☰ 菜单","c":"<p><b>☰</b> 按钮（主屏幕左上角）打开<b>菜单</b> —— 这是使用应用的起点。里面有：</p>\n<ul>\n<li><b>当前项目</b>和快速切换列表（最多 7 个学年）。</li>\n<li><b>文件：</b>新建和管理项目，导出/导入<b>备份 (.json)</b>。</li>\n<li><b>激活 / 购买：</b>解锁完整版（通过网站购买的版本）。</li>\n<li><b>帮助：</b>使用教程、<b>演示模式</b>、语言、隐私、使用条款、更新和版本。</li>\n</ul>\n<p>点按菜单旁边的深色区域或 <b>✕</b> 即可关闭。</p>","f":[{"img":"02-menu","leg":["管理项目（学年）","导出备份（.json）","放大文字"]}]},{"ic":"ti-archive","t":"项目 — 学年","c":"<p>每个<b>项目</b>保存一个完整学年（年份 + 学校），包含全部科目、课程和文档。</p>\n\n<ul>\n<li><b>创建：</b>菜单 ☰ → <b>新建项目</b> → 填写<b>年份</b>和<b>学校</b>。新项目从空白开始并成为当前项目。</li>\n<li><b>归档：</b>不会丢失任何内容 — 上一学年保留在项目列表中。</li>\n<li><b>切换：</b>点按主屏幕的学年栏，或打开 ☰ 菜单并点按列表中的某个项目——它会成为当前项目并打开<b>管理项目</b>屏幕。<b>管理项目</b>按钮就在菜单顶部。</li>\n<li><b>管理项目：</b>列表中的每个学年都有四个图标 — <b>下载</b>（仅导出该学年的备份）、<b>铅笔</b>（编辑年份和学校）、<b>复制</b>（复制整个学年及其全部内容）和<b>垃圾桶</b>（删除）。</li>\n<li><b>保存到设备之外：</b>使用<b>导出备份</b>（见下方备份部分）。</li>\n</ul>","f":[{"img":"03-projetos","leg":["仅下载该学年的备份","编辑学年与学校","复制整个学年","删除该学年"]}]},{"ic":"ti-books","t":"科目与年级","c":"<p>主屏幕列出<b>科目</b>。每个科目内是<b>年级</b>（如高一、高二、高三）。</p>\n<ul>\n<li><b>新科目：</b>主屏幕底部的大按钮。</li>\n<li><b>新年级：</b>打开科目后点按<b>新年级</b>。</li>\n<li><b>自动建议：</b>创建年级、课程、章节或项目时，应用会在输入框中以<b>浅灰色</b>显示下一个编号（例如“高二”之后显示“高三”）。按键盘上的<b>右箭头 → 键</b>即可接受；若要其他值，直接输入覆盖即可。</li>\n<li><b>复制/粘贴年级：</b>年级卡片上的<b>复制</b>图标可复制整个年级（课程、章节、视频和附件）。打开目标科目——甚至是<b>另一个学年/项目</b>——再点按<b>粘贴年级</b>。</li>\n<li><b>复制科目：</b>科目卡片上的<b>复制</b>图标可复制整个科目及其所有年级。切换到另一个学年后点按<b>粘贴科目</b>；若要取消待粘贴的副本，点按粘贴按钮旁的 <b>✕</b>。</li>\n<li>年级卡片上的<b>箭头按钮（课程数）</b>可展开课程树。</li>\n<li><b>每个年级的时长：</b>卡片显示三个指标——<b>总时长</b>（所有视频时长之和）、<b>已授课</b>（已标记为完成的章节）和<b>未授课</b>（尚未完成的部分）。勾选章节时它们会自动更新。</li>\n<li>年级上的<b>报告</b>图标可生成包含整个结构的 Word/PDF 文档。</li>\n<li><b>铅笔</b>和<b>垃圾桶</b>图标用于编辑和删除。</li>\n</ul>","f":[{"img":"04-series","leg":["复制年级","年级报告","展开课程列表"]}]},{"ic":"ti-player-play","t":"课程与章节","c":"<p>年级内是自动编号的<b>课程</b>，每节课内是<b>章节</b>。</p>\n\n<ul>\n<li><b>复制/粘贴课程：</b>课程卡片上的<b>复制</b>图标可复制整节课（章节、视频和附件）。打开目标年级——可以是<b>另一个学年/项目</b>——再点按底部出现的<b>粘贴课程</b>按钮。</li>\n<li><b>一次转移多节课：</b>在某节课上按住 <b>2 秒</b>且不拖动 — 每节课都会出现<b>选择框</b>。勾选想要的课程，然后用底部出现的操作栏把它们一起复制到另一个年级。</li>\n<li>章节的<b>勾选框</b>控制待办状态：勾选 = 尚未授课；空 = 已授课。“● 待授课”计数会汇总到课程、年级和科目。</li>\n<li><b>CP1…CP11 圆片</b>在章节有内容时亮起；点按亮起的圆片可滚动到对应章节。</li>\n<li><b>备注：</b>每个章节都有一个默认收起的“备注”面板，可自由记录 — 提醒、任务、教材页码。● 圆点表示已保存文字。</li>\n</ul>","f":[{"img":"05-aulas","leg":["复制课程"]},{"img":"06-selecao","leg":["选择框（长按课程 2 秒）","转移所选课程的底栏"]},{"img":"07-capitulos","leg":["将章节标记为已授课","章节标签（CP）","章节备注","打开视频"]}]},{"ic":"ti-video-off","t":"视频","c":"<p>在章节内点按<b>添加视频</b>。在表单中可以填写：</p>\n<ul>\n<li>视频<b>名称</b>（必填）。</li>\n<li><b>YouTube 链接：</b>粘贴后应用会自动填写<b>视频名称</b>和<b>时长</b>（仅此时需要网络）。没有链接时，放大镜按钮可按名称在 YouTube 上搜索。</li>\n<li><b>时长</b>在链接旁的小输入框中（MM:SS 或 H:MM:SS）— 如未自动检测请手动填写；计入课程、年级和科目的总时长。</li>\n<li>最多约 3 页的<b>摘要</b> — 位于搜索按钮下方的收起区域，点按即可展开。可导出为 <b>Word (.doc)</b> 或 <b>PDF</b>。</li>\n<li><b>自动草稿：</b>在此表单中输入的内容会自动保存；如果应用在保存前关闭，下次打开时会提示恢复全部内容。</li>\n</ul>\n<p>在列表中，<b>▶</b> 打开视频链接；时间旁的图标显示是否有摘要、材料或附件。</p>","f":[{"img":"08-video","leg":["视频名称","YouTube 链接","时长","视频摘要"]}]},{"ic":"ti-paperclip","t":"教学材料与文档","c":"<p>在视频表单中，<b>“教学材料与文档”</b>部分默认收起 — 点按即可展开。</p>\n\n<ul>\n<li><b>引用材料：</b>仅含视频中提到书籍<b>标题</b>的简单列表。每条材料旁的<b>放大镜</b>可在网上搜索该书的<b>免费 PDF</b> 版本。</li>\n<li><b>附件文档：</b>点按<b>导入 PDF、图片、Word 或音频</b>，每个视频最多可在应用内保存 <b>10 个文件</b>（每个最大 <b>100 MB</b> — 足以放下一整本书）。</li>\n<li>每个文档都有可编辑的<b>标题</b>，并带有<b>缩略图</b>（照片）或<b>彩色标识</b>（PDF、DOC、音频），一眼即可识别类型。</li>\n<li><b>眼睛</b>图标可直接打开 PDF 和图片；Word 文件会下载后用设备上的编辑器打开。如果某个 PDF 打不开，请换一个文档试试 — 有些文件本身已损坏。</li>\n<li><b>分享</b>按钮可通过 <b>WhatsApp</b>、电子邮件或设备上的其他应用发送文档。</li>\n<li>附件会包含在项目备份和报告中。</li>\n</ul>","f":[{"img":"09-materiais","leg":["教学材料与文档栏目","导入 PDF、图片、Word 或音频","拍照"]}]},{"ic":"ti-undo","t":"撤销、回收站与排序","c":"<p>操作错了或不小心删除了？应用有三重保护 — 还可以拖动调整一切的位置：</p>\n<ul>\n<li><b>撤销卡片：</b>删除任何内容（视频、章节、课程、年级、科目或学年）时，<b>右上角</b>会出现一张持续 10 秒的卡片 — 点按<b>撤销</b>，该内容会立刻完整恢复。卡片消失也不要紧：它仍在回收站里。</li>\n<li><b>回收站：</b>第一次删除后，顶栏会出现一个<b>带计数的垃圾桶按钮</b>。它保存<b>最近 10 次删除</b>；点按它并对想找回的内容使用<b>恢复</b>。注意：回收站是临时的 — <b>关闭应用即清空</b>。</li>\n<li><b>全局撤销（↩）：</b>垃圾桶旁的 <b>↩</b> 按钮可逐步撤销<b>最近的更改</b>，无论是什么（编辑、章节勾选、删除…），最多 30 步。</li>\n<li><b>拖动排序：</b>按住（约半秒）任意卡片 — 科目、年级、课程、章节、视频或学年 — 上下拖动即可调整顺序。</li>\n</ul>","f":[{"img":"10-desfazer","leg":["撤销卡片（10 秒）","带计数的回收站","通用撤销（↩）"]},{"img":"11-lixeira","leg":["恢复已删除的项目"]}]},{"ic":"ti-palette","t":"主题","c":"<p>右上角的按钮在 6 种主题间切换 — 偏好会被保存：</p>\n<ol>\n<li><b>浅色</b> — 米色背景，赤陶红。</li>\n<li><b>深色</b> — OLED 纯黑配白色霓虹。</li>\n<li><b>普罗米修斯</b> — 青色科幻 HUD（应用的招牌）。</li>\n<li><b>普罗米修斯·红</b>和<b>普罗米修斯·蓝</b> — 两种变体。</li>\n<li><b>Sinal Noturno</b>（夜间信号）— 夜蓝底色配青色与琥珀色。</li>\n</ol>\n<p>在<b>普罗米修斯</b>系列主题中，每张卡片都会变成一个<b>3D 玻璃盒</b>：点按时它会轻轻摇摆，然后自动复位。（该效果会遵循设备的“减弱动态效果”设置。）</p>"},{"ic":"ti-eye","t":"文字大小与缩放","c":"<p>如果您更喜欢较大的文字：</p>\n<ul>\n<li><b>☰ → 文字大小：</b>点按 <b>A+</b> 放大文字，点按 <b>A−</b> 缩小。共有 <b>4 种大小</b>，从 100% 到 145%；选择会被保存。按钮和图标保持原位，因此不会错位。</li>\n<li><b>双指缩放：</b>在手机和平板上，也可以在任意屏幕上张开两根手指进行放大（捏合手势）。</li>\n</ul>"},{"ic":"ti-report","t":"报告与导出","c":"<ul>\n<li><b>年级报告：</b>年级卡片上的报告图标 → Word 或 PDF，包含课程、章节、视频、链接、备注、待办和文档。</li>\n<li><b>视频摘要：</b>在视频表单内 → Word 或 PDF，包含摘要文字、教学材料和附件。</li>\n<li>导出 PDF 时浏览器会打开打印对话框：选择<b>“另存为 PDF”</b>。</li>\n<li><b>在平板/手机上：</b>请将 PDF 保存到<b>内部存储</b>（下载文件夹）。直接保存到<b>存储卡</b>可能出现“文件已损坏”——这是安卓系统的限制，并非应用问题；之后可用文件管理器把文件移动到存储卡。</li>\n</ul>"},{"ic":"ti-shield","t":"备份与数据安全","c":"<p><b>保存是自动的。</b>你输入的一切都会在每次更改时自动保存到<b>此设备的浏览器</b>中——没有“保存”按钮，也不会上传到网络。但如果卸载应用或清除浏览器数据，数据将丢失。因此，若要<b>更换设备</b>或保留安全副本，请导出备份：</p>\n<ul>\n<li><b>导出：</b>☰ → 文件 → <b>导出备份 (.json)</b> — 生成包含整个项目（含附件）的文件。</li>\n<li><b>文件名：</b><code>prometeu-&lt;年份&gt;.json</code>（例如 <b>prometeu-2026.json</b>；若项目含机构名，会加入文件名）。这就是你带到其他设备的文件。</li>\n<li><b>保存位置：</b>设备的<b>下载文件夹</b>——<b>Windows</b> 为“下载/Downloads”；<b>Android</b> 为“Download”；<b>iPhone/iPad</b> 为<b>文件</b>应用 →“下载”。请复制到 Google 云端硬盘、邮箱或 U 盘以防丢失。</li>\n<li><b>导入：</b>☰ → 文件 → <b>导入备份 (.json)</b> — 在新设备上选择该文件即可重建整个项目。</li>\n<li>建议：每学期末以及更新应用前都导出一次。</li>\n</ul>","f":[{"img":"12-backup","leg":["导出备份（.json）","导入备份（.json）"]}]},{"ic":"ti-device-tablet","t":"在三星平板上（Galaxy Tab S）","c":"<p>应用已针对平板优化 — 全屏、One UI 的<b>分屏</b>和<b>弹窗视图</b>：</p>\n\n<ul>\n<li><b>在 Android 手机/平板上安装：</b>在 Chrome 中打开网站 → ⋮ 菜单 → <b>“安装应用”</b>（或“添加到主屏幕”）。应用将在独立窗口中打开，没有浏览器栏。</li>\n<li><b>在 iPhone/iPad 上安装：</b>用 <b>Safari</b> 打开网站 → <b>分享</b>按钮（带箭头的方块）→ <b>“添加到主屏幕”</b>。</li>\n<li><b>在电脑（Windows）上安装：</b>用 <b>Edge 或 Chrome</b> 打开网站，点击地址栏中的<b>安装图标</b>——应用会成为带开始菜单图标的程序。</li>\n<li><b>分屏：</b>点按<b>最近任务</b>，点按卡片顶部的<b>应用图标</b> → <b>“在分屏视图中打开”</b> → 选择第二个应用（如 YouTube）。</li>\n<li><b>弹窗视图：</b>在最近任务中点按应用图标 → <b>“在弹窗视图中打开”</b> — 应用变为悬浮在其他应用上的小窗口。</li>\n<li>布局会在任何窗口尺寸下自动调整。在“备注”栏中已停用手写笔的手写转文字功能（请使用键盘），以避免转换错误。</li>\n</ul>"},{"ic":"ti-alert-triangle","t":"常见问题与解决办法","c":"<p>在认为出了故障之前，请先查看这份清单 — 大多数情况都有简单的解决办法：</p>\n<ul>\n<li><b>把 PDF 或备份保存到存储卡时提示“文件已损坏”：</b>这是 Android 的限制 — 应用只能可靠地写入设备的<b>内部存储</b>。请始终保存到<b>下载（Downloads）</b>文件夹（内部存储），之后如有需要，再用文件管理应用把文件移到存储卡。</li>\n<li><b>数据不见了：</b>数据保存在本设备的浏览器里。<b>清除浏览器/网站数据</b>或卸载应用会删除全部内容。预防办法：经常导出<b>备份（.json）</b>（☰ → 文件）。</li>\n<li><b>视频时长没有出现：</b>自动识别需要在粘贴链接的那一刻联网。离线时，请在链接旁边的小输入框里手动填写时长（MM:SS）。</li>\n<li><b>应用顶部出现浏览器地址栏：</b>说明没有以应用方式完成安装。请通过网站重新安装（Chrome → ⋮ → <b>“安装应用”</b>），或在网站的购买页下载最新的 APK。</li>\n<li><b>付款后没有收到激活码：</b>请检查<b>垃圾邮件</b>文件夹。如果也没有，请写信给支持邮箱（☰ → 激活），并注明购买时使用的邮箱。</li>\n<li><b>付款页面显示的金额比宣传的高：</b>Mercado Pago 有时会推荐它的“信用额度”（含利息）。请返回并选择 <b>Pix</b> 或普通银行卡 — 确认前会显示正确金额。</li>\n<li><b>附件里的 PDF 打不开：</b>有些文件本身就已损坏。请试试其他文档；如果其他文件能打开，问题出在文件本身，而不是应用。</li>\n<li><b>离线时字体变了样：</b>属于正常现象 — 没有网络时应用会改用系统字体，不会丢失任何内容。</li>\n</ul>"},{"ic":"ti-help","t":"更新与版本","c":"<ul>\n<li><b>☰ → 帮助 → 更新：</b>说明每种版本（PWA 或单文件）的更新方式，并检查是否有新版本。</li>\n<li><b>☰ → 帮助 → 版本：</b>显示已安装的版本和数据概要。</li>\n</ul>"}]};
const UI={"nav1":["Recursos","Features","Recursos","功能"],"nav3":["Preço","Pricing","Precio","价格"],"nav4":["Instalar","Install","Instalar","安装"],"nav5":["Manual","Manual","Manual","手册"],"nav6":["Galeria","Gallery","Galería","图库"],"nav7":["Desenvolvedor","Developer","Desarrollador","开发者"],"nav8":["Tablet","Tablet","Tablet","平板"],"nav9":["Comprar","Buy","Comprar","购买"],"title":["Manual completo","Full manual","Manual completo","完整手册"],"back":["← Voltar ao site","← Back to site","← Volver al sitio","← 返回网站"],"lead":["Guia passo a passo do Organizador de Aulas — o mesmo tutorial que vem dentro do app, para você consultar antes de instalar. Toque em cada seção para abrir.","A step-by-step guide to the Lesson Organizer — the same tutorial that ships inside the app, so you can read it before installing. Tap each section to expand.","Guía paso a paso del Organizador de Clases — el mismo tutorial que viene dentro de la app, para leerlo antes de instalar. Toca cada sección para abrir.","《课程管理器》分步指南 —— 与应用内相同的教程，安装前即可查阅。点击各节展开。"],"extraH":["Em resumo, o que o app faz","In short, what the app does","En resumen, qué hace la app","应用功能一览"],"extra":["<ul>\n      <li><b>Organiza em 5 níveis:</b> Matéria → Série/Ano → Aula → Capítulo → Vídeo, do geral ao específico.</li>\n      <li><b>Controla o que já foi dado:</b> cada capítulo tem uma marcação de \"ministrado\"; o app soma as horas totais, as já ministradas e as que faltam, por série e por matéria.</li>\n      <li><b>Guarda tudo por vídeo:</b> link do YouTube (com nome e duração preenchidos ao colar), espaço para você escrever ou colar um resumo de até ~3 páginas, materiais citados e documentos anexados (PDF, imagem, Word ou áudio, até 100 MB cada).</li>\n      <li><b>Exporta relatórios</b> em Word e PDF — da série inteira ou do resumo de um vídeo.</li>\n      <li><b>Vários anos letivos</b> em projetos separados, com backup em arquivo <code>.json</code> para levar de um aparelho a outro.</li>\n      <li><b>100% offline e privado:</b> os dados ficam só no aparelho; nada é enviado para a internet. Salva sozinho a cada alteração.</li>\n      <li><b>Acessível:</b> 5 temas visuais, 4 idiomas e ajuste de tamanho do texto (até 150%).</li>\n    </ul>","<ul>\n      <li><b>Organizes in 5 levels:</b> Subject → Grade → Lesson → Chapter → Video, from broad to specific.</li>\n      <li><b>Tracks what you've taught:</b> each chapter has a \"taught\" mark; the app adds up total hours, hours taught and hours left, per grade and per subject.</li>\n      <li><b>Keeps everything per video:</b> YouTube link (name and length filled in on paste), space to write or paste your own summary of up to ~3 pages, cited materials and attached documents (PDF, image, Word or audio, up to 100 MB each).</li>\n      <li><b>Exports reports</b> in Word and PDF — the whole grade or a single video's summary.</li>\n      <li><b>Multiple school years</b> as separate projects, with a <code>.json</code> file backup to move between devices.</li>\n      <li><b>100% offline and private:</b> data stays only on the device; nothing is sent online. Saves itself on every change.</li>\n      <li><b>Accessible:</b> 5 visual themes, 4 languages and text size control (up to 150%).</li>\n    </ul>","<ul>\n      <li><b>Organiza en 5 niveles:</b> Materia → Curso/Año → Clase → Capítulo → Vídeo, de lo general a lo específico.</li>\n      <li><b>Controla lo ya impartido:</b> cada capítulo tiene una marca de \"impartido\"; la app suma las horas totales, las ya impartidas y las que faltan, por curso y por materia.</li>\n      <li><b>Guarda todo por vídeo:</b> enlace de YouTube (nombre y duración al pegar), espacio para escribir o pegar tu propio resumen de hasta ~3 páginas, materiales citados y documentos adjuntos (PDF, imagen, Word o audio, hasta 100 MB cada uno).</li>\n      <li><b>Exporta informes</b> en Word y PDF — del curso entero o del resumen de un vídeo.</li>\n      <li><b>Varios años escolares</b> en proyectos separados, con copia de seguridad en archivo <code>.json</code> para pasar de un dispositivo a otro.</li>\n      <li><b>100% sin conexión y privado:</b> los datos quedan solo en el dispositivo; nada se envía a internet. Se guarda solo en cada cambio.</li>\n      <li><b>Accesible:</b> 5 temas visuales, 4 idiomas y ajuste del tamaño del texto (hasta 150%).</li>\n    </ul>","<ul>\n      <li><b>五级结构：</b>科目 → 年级 → 课程 → 章节 → 视频，由概括到具体。</li>\n      <li><b>跟踪授课进度：</b>每个章节都有\"已授课\"标记；应用会按年级和科目自动统计总课时、已授课时和剩余课时。</li>\n      <li><b>按视频保存一切：</b>YouTube 链接（粘贴时自动填入名称和时长）、可自行撰写或粘贴的摘要（约 3 页以内）、引用的教材以及附加文档（PDF、图片、Word 或音频，每个最大 100 MB）。</li>\n      <li><b>导出报告：</b>支持 Word 和 PDF —— 整个年级或单个视频的摘要。</li>\n      <li><b>多个学年：</b>以独立项目分开管理，可导出 <code>.json</code> 备份文件在设备间迁移。</li>\n      <li><b>100% 离线且私密：</b>数据仅保存在本机，不会上传网络。每次修改自动保存。</li>\n      <li><b>无障碍：</b>5 种视觉主题、4 种语言，以及文字大小调节（最高 150%）。</li>\n    </ul>"],"themeLbl":["Tema","Theme","Tema","主题"]};
const LANGS=["pt","en","es","zh"];
const LANG_HTML={"pt":"pt-BR","en":"en","es":"es","zh":"zh-CN"};
const LKEY='prometeu.site.lang', TKEY='prometeu.site.theme';

function renderMan(l){
  const idx=LANGS.indexOf(l), secs=DATA[l]||DATA.pt;
  document.getElementById('man').innerHTML=secs.map((s,i)=>
    '<details class="sec"'+(i===0?' open':'')+'><summary><span class="n">'+(i+1)+'</span><span>'+
    s.t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span></summary><div class="body">'+s.c+
    (s.f?s.f.map(f=>'<figure class="mshot"><img loading="lazy" src="screenshots/tutorial/'+f.img+'.jpg" alt="'+s.t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')+'"><figcaption>'+
      f.leg.map((tx,j)=>'<span class="fl"><b>'+(j+1)+'</b><span>'+tx.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span></span>').join('')+
    '</figcaption></figure>').join(''):'')+'</div></details>'
  ).join('');
  document.getElementById('mTitle').textContent=UI.title[idx];
  document.getElementById('mLead').textContent=UI.lead[idx];
  document.getElementById('exH').textContent=UI.extraH[idx];
  document.getElementById('exBody').innerHTML=UI.extra[idx];
  document.querySelectorAll('nav [data-i]').forEach(el=>{const v=UI[el.dataset.i];if(v&&v[idx]!=null)el.textContent=v[idx];});
  document.documentElement.lang=LANG_HTML[l];
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  try{localStorage.setItem(LKEY,l);}catch(e){}
}
function setTheme(t){
  document.documentElement.className=t==='P'?'':'t-'+t;
  document.querySelectorAll('#themes .sw').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  try{localStorage.setItem(TKEY,t);}catch(e){}
}
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>renderMan(b.dataset.l));
document.querySelectorAll('#themes .sw').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
(function(){
  let l='pt',t='P';
  try{l=localStorage.getItem(LKEY)||(/^zh/i.test(navigator.language)?'zh':/^es/i.test(navigator.language)?'es':/^en/i.test(navigator.language)?'en':'pt');}catch(e){}
  try{t=localStorage.getItem(TKEY)||'P';}catch(e){}
  if(!LANGS.includes(l))l='pt';
  setTheme(t); renderMan(l);
})();
</script>
